name: Governance Code Scanning

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "41 3 * * 1"

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  governance:
    name: Governance
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run governance scanner
        run: node scripts/governance-scan.mjs

      - name: Upload governance SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: runtime-artifacts/governance.sarif
          category: governance

      - name: Upload governance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vsn-governance-scan
          path: runtime-artifacts/governance.sarif
          if-no-files-found: error
