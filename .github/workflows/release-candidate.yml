name: Release Candidate Runtime Acceptance
on:
  workflow_dispatch:
    inputs:
      release:
        description: Release identifier to verify
        required: true
        type: string
  push:
    tags:
      - 'v*'

jobs:
  locked-runtime-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, pdo_mysql, mbstring, bcmath, gd, intl, dom, xml, xmlwriter
          tools: composer:v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Require committed dependency locks
        run: |
          test -f composer.lock || { echo 'composer.lock is required for a release candidate'; exit 1; }
          test -f package-lock.json || { echo 'package-lock.json is required for a release candidate'; exit 1; }
      - name: Runtime capability gate
        run: php scripts/runtime-capability-audit.php --strict --json=runtime-artifacts/runtime-capabilities.json
      - name: Validate Composer lock
        run: composer validate --strict --no-check-publish
      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Install locked frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Build frontend
        run: npm run build
      - name: Laravel SQLite regression
        run: php artisan test --configuration=phpunit.xml
      - name: Static final acceptance audits
        run: bash scripts/final-static-acceptance.sh
      - name: Record lock-bound candidate evidence
        env:
          RELEASE_INPUT: ${{ inputs.release }}
        run: |
          mkdir -p runtime-artifacts
          RELEASE="${RELEASE_INPUT:-${GITHUB_REF_NAME#v}}"
          COMPOSER_SHA="$(sha256sum composer.lock | awk '{print $1}')"
          NPM_SHA="$(sha256sum package-lock.json | awk '{print $1}')"
          TREE_SHA="$(find . -type f ! -path './vendor/*' ! -path './node_modules/*' ! -path './runtime-artifacts/*' -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')"
          cat > runtime-artifacts/locked-runtime-candidate.json <<JSON
          {"schema":"vsn-locked-runtime-candidate-v1","passed":true,"release":"$RELEASE","commitSha":"$GITHUB_SHA","composerLockSha256":"$COMPOSER_SHA","npmLockSha256":"$NPM_SHA","sourceTreeSha256":"$TREE_SHA","generatedAt":"$(date -u +%Y-%m-%dT%H:%M:%SZ)"}
          JSON
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vsn-locked-runtime-candidate
          path: runtime-artifacts/
          if-no-files-found: error
